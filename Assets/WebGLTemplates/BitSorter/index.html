<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
/* The default look's colours, SchematicPalette.Dark's to the digit (WebTemplateTests holds them to it): the page is
   drawn before BitSorter exists, so it cannot ask. The footer in style.css takes its colours from them too. */
:root{
  --ground:#151515;--grid:#282828;--chip:#1D1D1C;--edge:#2C2C2C;--outline:#969696;
  --text:#F1EFE8;--dim:#C2C0B6;--muted:#9C9A92;--accent:#85B7EB;
  --v0:#7F77DD;--v1:#D4537E;--vx:#E5484D;--vz:#8A8A86;--bus:#B4AE9C;--playhead:#D4537E;--cursor:#E6C45C;--sel:#272F37;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}

/* The loading screen, over the canvas until BitSorter is running: a living schematic of its own world. */
/* ---------- the loading layer ---------- */
#bs-loading{position:absolute;inset:0;z-index:10;overflow:hidden;background:var(--ground);contain:strict;container-type:size;font-family:var(--sans);color:var(--dim)}
#bs-loading i{display:block}
.bs-in,.bs-bg,.bs-L,.bs-d,.bs-pool,.bs-vig{position:absolute;inset:0}
.bs-in{transition:opacity .3s}
.bs-done .bs-in{opacity:0}
.bs-bg,.bs-bg *{pointer-events:none}
.bs-scene{position:absolute;left:50%;top:50%;width:1600px;height:1000px;margin:-500px 0 0 -800px}
.bs-L{animation:bs-in 1.8s ease-out both}
@keyframes bs-in{from{opacity:0}}
.bs-far{opacity:.26;transform:scale(.94)}
.bs-mid{opacity:.56;animation-delay:.25s}
.bs-near{opacity:.15;transform:scale(5);animation-delay:.5s}
/* one camera drift: the nearer, the further */
.bs-d{animation:30s ease-in-out infinite alternate}
.bs-far>.bs-d{animation-name:bs-df}.bs-mid>.bs-d{animation-name:bs-dm}.bs-near>.bs-d{animation-name:bs-dn}
@keyframes bs-df{from{transform:translate(-9px,-4px)}to{transform:translate(9px,4px)}}
@keyframes bs-dm{from{transform:translate(-22px,-9px)}to{transform:translate(22px,9px)}}
@keyframes bs-dn{from{transform:translate(-9px,-3.5px)}to{transform:translate(9px,3.5px)}}
.bs-grid{position:absolute;inset:-420px -640px;background:radial-gradient(circle,var(--grid) 1.1px,transparent 1.5px) 0 0/16px 16px}
.bs-L svg{position:absolute;overflow:visible}
.bs-L text{font:12px var(--mono);fill:var(--muted)}
.g,.blk{fill:var(--chip);stroke:var(--outline);stroke-width:1.5;stroke-linejoin:round}
.ld,.ch,.ctl,.row,.bus,.bed,.w0,.w1,.we,.wb{fill:none;stroke:var(--outline);stroke-width:1.5}
.bed{stroke:var(--edge);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.bs-near .bed{stroke-width:7}.bs-near .g,.bs-near .ld{stroke-width:1}
.ch{opacity:.7}.ctl{stroke-width:1;stroke-dasharray:4 5}.row{stroke:var(--edge);stroke-width:1}
.bus{stroke:var(--bus);stroke-width:3;opacity:.55}
.w0{stroke:var(--v0)}.w1{stroke:var(--v1)}.we{stroke:var(--vz)}.wb{stroke:var(--bus);stroke-width:1.2}
.bs-L .s{font-size:9px}.bs-L .t{font-size:7px}.bs-L .bl{font-size:13px;letter-spacing:.1em}.bs-L .dg{font-size:11px;font-weight:600}
.bs-L .eq{fill:var(--dim);font-size:13px;opacity:0;transition:opacity .6s}.bs-L .on{opacity:1}
.pt .hit{fill:transparent;pointer-events:all;cursor:pointer}
.pt .ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:0;transition:opacity .2s}
.pt:hover .ring{opacity:1}.pt:hover .g{stroke:var(--text)}
.jd{fill:var(--outline)}
.bs-wv{position:absolute;overflow:hidden;opacity:.75}
.bs-wv svg{animation:bs-scroll 32s linear infinite}
@keyframes bs-scroll{to{transform:translateX(-1280px)}}
.bs-ph{position:absolute;width:1.5px;background:var(--playhead)}
.bw{position:absolute;overflow:hidden}
.bb{position:absolute;border-radius:9px}
.hd{position:absolute;left:0;top:0;border-radius:50%}
/* light */
.bs-a{position:absolute;border-radius:50%}
.a0{left:-35%;bottom:-55%;width:95%;height:120%;background:radial-gradient(closest-side,color-mix(in srgb,var(--v0) 15%,transparent),transparent)}
.a1{right:-30%;top:-55%;width:85%;height:110%;background:radial-gradient(closest-side,color-mix(in srgb,var(--v1) 11%,transparent),transparent)}
.a2{left:15%;top:22%;width:70%;height:44%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 12%,transparent),transparent);animation:bs-br 8s ease-in-out infinite alternate}
@keyframes bs-br{from{opacity:.5}}
.bs-pool{background:radial-gradient(ellipse 40% 31% at 50% 48%,color-mix(in srgb,var(--ground) 92%,transparent),color-mix(in srgb,var(--ground) 62%,transparent) 55%,transparent)}
.bs-vig{background:radial-gradient(ellipse 78% 74%,transparent 52%,color-mix(in srgb,var(--ground) 88%,transparent))}
/* the foreground */
.bs-fg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;pointer-events:none;animation:bs-up 1s cubic-bezier(.2,.7,.2,1) .15s both}
@keyframes bs-up{from{opacity:0;transform:translateY(10px)}}
.bs-mark{display:block;width:min(560px,80vw);width:min(560px,80cqw);height:auto;overflow:visible;fill:var(--accent);filter:drop-shadow(0 0 22px color-mix(in srgb,var(--accent) 28%,transparent))}
.bs-sub{margin:clamp(12px,2.4vmin,22px) 0 0;margin:clamp(12px,2.4cqmin,22px) 0 0;font:500 12px/1.4 var(--sans);letter-spacing:.32em;text-indent:.32em;text-transform:uppercase;color:var(--muted);text-align:center}
.bs-prog{margin-top:clamp(28px,6.5vmin,60px);margin-top:clamp(28px,6.5cqmin,60px);width:min(520px,86vw);width:min(520px,86cqw)}
.bs-wire{position:relative;height:18px}
.bs-wire i,.bs-car i{position:absolute}
.bs-track,.bs-fill{left:0;right:0;top:8px;height:2px;border-radius:1px;background:var(--v0);opacity:.5}
.bs-fill{background:var(--v1);opacity:1;transform-origin:0;transform:scaleX(0);box-shadow:0 0 8px var(--v1)}
.bs-fill,.bs-car{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.bs-full .bs-fill,.bs-full .bs-car{transition-duration:.12s}
.bs-car{inset:0}
.bs-head,.bs-halo,.bs-pin{top:4px;left:-5px;width:10px;height:10px;border-radius:50%;box-sizing:border-box;background:var(--v1)}
.bs-head{background:var(--text);box-shadow:0 0 6px 2px var(--v1),0 0 20px 7px color-mix(in srgb,var(--v1) 40%,transparent)}
.bs-halo{left:-14px;top:-5px;width:28px;height:28px;border:1px solid var(--v1);background:none;opacity:.35;animation:bs-halo 1.7s ease-out infinite}
@keyframes bs-halo{from{transform:scale(.3);opacity:.9}to{transform:scale(1.5);opacity:0}}
.bs-pin+.bs-pin{left:auto;right:-5px;border:2px solid var(--outline);background:var(--ground)}
.bs-full .bs-pin+.bs-pin{background:var(--v1);border-color:var(--v1);box-shadow:0 0 10px var(--v1)}
.bs-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font:13px/1.3 var(--sans)}
.bs-status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs-reg{display:flex;align-items:center;gap:3px;flex:none}
.bs-bit{width:7px;height:11px;border-radius:2px;box-sizing:border-box;border:1px solid color-mix(in srgb,var(--v0) 75%,transparent)}
.bs-bit.on{background:var(--v1);border-color:var(--v1);box-shadow:0 0 6px color-mix(in srgb,var(--v1) 60%,transparent)}
.bs-pct{margin-left:8px;min-width:4ch;text-align:right;font:500 13px/1 var(--mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){#bs-loading *{animation:none!important}.bs-fill,.bs-car{transition:none}}
/* a load that failed: everything stands where it is, and the half adder takes no more clicks */
#bs-loading.bs-stop *{animation-play-state:paused!important}#bs-loading.bs-stop .hit{pointer-events:none}

      </div>

  b.style.background = vc(v); b.style.boxShadow = '0 0 ' + w * 2 + 'px ' + vc(v);
  return b;
}
function T(s, f) { return 'translate' + (s.y0 == s.y1 ? 'X(' : 'Y(') + (s.x1 + s.y1 > s.x0 + s.y0 ? f : -f) * s.Lw + 'px)'; }
// a glint riding a front along its path
function head(lay, p, t0, P, v, sz, c, once) {

      // ground the first frame is drawn on, and takes itself out of the page with every animation, timer and listener
      // it had. On a failure it stops where it stands, under the alert.
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          setProgress(progress);
              }).then((unityInstance) => {
                finishLoading();

                // The cap above was read once, and it replaces Unity's own live read of the window's
                // ratio -- so a page zoomed, or a window moved to a sharper screen, went on rendering
                // at the ratio BitSorter loaded at. Unity reads Module.devicePixelRatio each time it
                // sizes the canvas, so keeping that current is the whole fix. The media query
                // matches the ratio in force and fires once when it stops matching, whether the
                // cause was a zoom or a change of screen that left the window's size alone.
                //
                // Safari before 14 has no addEventListener on a media query, and a throw in here would
                // reach the .catch below and put up an alert over the game. There, a resize -- which
                // zooming raises -- keeps it current instead.
                function followPixelRatio() {
                  unityInstance.Module.devicePixelRatio = cappedPixelRatio();

                  var query = window.matchMedia("(resolution: " + window.devicePixelRatio + "dppx)");

                  if (query.addEventListener)
                    query.addEventListener("change", followPixelRatio, { once: true });
                }

                followPixelRatio();
                window.addEventListener("resize", function () {
                  unityInstance.Module.devicePixelRatio = cappedPixelRatio();
                });
#if SHOW_DIAGNOSTICS
                document.getElementById("diagnostics-icon").onclick = () => {
                  unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
                };
#endif
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

#if DEVELOPMENT_PLAYER
                var profile = unityProfiler.createButton(unityInstance);
                profile.style.marginLeft = '5px';
                document.querySelector("#unity-build-title").appendChild(profile);

                // Unloading web content from DOM so that browser GC can run can be tricky to get right.
                // This code snippet shows how to correctly implement a Unity content Unload mechanism to a web page.

                // Unloading Unity content enables a web page to reclaim the memory used by Unity, e.g. for
                // the purpose of later loading another Unity content instance on the _same_ web page.

                // When using this functionality, take caution to carefully make sure to clear all JavaScript code,
                // DOM element and event handler references to the old content you may have retained, or
                // otherwise the browser's garbage collector will be unable to reclaim the old page.

                // N.b. Unity content does _not_ need to be manually unloaded when the user is navigating away from
                // the current page to another web page. The browser will take care to clear memory of old visited
                // pages automatically. This functionality is only needed if you want to switch between loading
                // multiple Unity builds on a single web page.
                var quit = document.createElement("button");
                quit.style = "margin-left: 5px; background-color: lightgray; border: none; padding: 5px; cursor: pointer";
                quit.textContent = "Unload";
                document.querySelector("#unity-build-title").appendChild(quit);
                quit.onclick = () => {
                  // Quit Unity application execution
                  unityInstance.Quit().then(() => {
                    unityProfiler.shutDown();
                    // Remove DOM elements from the page so GC can run
                    document.querySelector("#unity-container").remove();
                    canvas = null;
                    // Remover script elements from the page so GC can run
                    script.remove();
                    script = null;
                  });
                };
#endif
              }).catch((message) => {
                stopLoading();
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
