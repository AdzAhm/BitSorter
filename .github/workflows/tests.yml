# Runs everything that does not need Unity, on every push and pull request.
#
# No Unity here. The four pure layers (Assets/Scripts/SystemVerilog, Sim, Board and ViewModel) have no engine
# references, so Tools/ci builds them with the plain .NET SDK against netstandard2.1, the profile Unity compiles them
# against. One solution runs:
#   - each layer's own tests;
#   - Repo.Tests, the rules about the repository: no ID numbers, and the pure layers stay pure;
#   - Oracle, designs run under Icarus Verilog, the second simulator the engine is checked against.
# The rest of the suite -- the view layer and the Play Mode tests -- runs in the editor.
#
# The workflow was called "LogicCore tests" while it ran the 4.x game's tests (LogicCore, deleted in Part 16a). The job is
# still `test`, which is what a check that is required would name.
name: Tests

on:
  push:
  pull_request:

# Read-only. The job checks the code out and runs tests; it writes nothing back, so its token
# should not be able to either -- without this it gets whatever the repository's default is.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # BITSORTER_REQUIRE_ICARUS turns "Icarus not found" from a skip into a failure, so a green run
      # here always means the oracle tests really ran.
      - name: Test
        run: dotnet test Tools/ci/BitSorter.Ci.slnx --configuration Release
        env:
          BITSORTER_REQUIRE_ICARUS: "1"
