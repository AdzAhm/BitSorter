name: Feature request
description: Something the simulator could do that it doesn't.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Two kinds of change need a conversation before any code: anything about what data
        BitSorter sends, and anything that ranks people against each other or against a par
        score. Both change a promise made to the people who use it; see CONTRIBUTING.md.

        Please do not paste or attach the course's own material.
  - type: dropdown
    id: area
    attributes:
      label: Where does it belong?
      options:
        - The circuit and its drawing
        - SystemVerilog the engine reads or runs
        - The waves
        - TIMING, LOGIC or STATES
        - Exercises, CHECK or the tutorial
        - Import, export or ModelSim
        - Settings or the looks
        - Something else
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or the missing piece?
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, a course topic it would help with, or how ModelSim or another simulator does it.
